<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 // Not Found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #00ff41;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas#matrix {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      opacity: 0.18;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      padding: 20px;
    }

    .terminal {
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #ff0033;
      border-radius: 6px;
      box-shadow: 0 0 30px rgba(255, 0, 51, 0.2), 0 0 60px rgba(255, 0, 51, 0.05);
      overflow: hidden;
    }

    .terminal-bar {
      background: #0d0d0d;
      border-bottom: 1px solid #ff003344;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red    { background: #ff5f57; }
    .dot.yellow { background: #febc2e; }
    .dot.green  { background: #28c840; }

    .terminal-title {
      margin-left: auto;
      font-size: 11px;
      color: #ff003377;
      letter-spacing: 1px;
    }

    .terminal-body {
      padding: 36px 32px 40px;
      text-align: center;
    }

    .error-code {
      font-size: clamp(5rem, 18vw, 9rem);
      color: #ff0033;
      text-shadow: 0 0 20px #ff003388, 0 0 40px #ff003344;
      letter-spacing: 8px;
      line-height: 1;
      animation: glitch 3s infinite;
    }

    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0); }
      91% { transform: translate(-3px, 1px); color: #ff0033; }
      92% { transform: translate(3px, -1px); color: #00ff41; }
      93% { transform: translate(-2px, 0); color: #ff0033; }
      94% { transform: translate(0); }
    }

    .error-label {
      font-size: 13px;
      color: #ff003399;
      letter-spacing: 4px;
      margin-top: 8px;
      text-transform: uppercase;
    }

    .divider {
      border: none;
      border-top: 1px solid #ff003333;
      margin: 24px auto;
      width: 60%;
    }

    .message {
      font-size: 13px;
      color: #aaffcc;
      line-height: 1.8;
      margin-bottom: 6px;
    }

    .message .cmd { color: #ff0033; }
    .message .path { color: #00ff41; }

    .prompt-line {
      margin-top: 20px;
      font-size: 13px;
      color: #00ff4166;
    }

    .home-btn {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 28px;
      border: 1px solid #00ff41;
      color: #00ff41;
      text-decoration: none;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      letter-spacing: 2px;
      transition: all 0.2s;
    }

    .home-btn::before { content: '$ '; color: #00ff4166; }

    .home-btn:hover {
      background: #00ff4111;
      box-shadow: 0 0 14px #00ff4133;
    }

    .cursor {
      display: inline-block;
      width: 9px; height: 1em;
      background: #00ff41;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
  <div class="terminal">
    <div class="terminal-bar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <span class="terminal-title">error.log</span>
    </div>
    <div class="terminal-body">
      <div class="error-code">404</div>
      <div class="error-label">// Page Not Found</div>
      <hr class="divider"/>
      <p class="message">
        <span class="cmd">ERROR:</span> The requested path
        <span class="path" id="req-path">/unknown</span> does not exist.
      </p>
      <p class="message">The file may have been moved, deleted, or never existed.</p>
      <div class="prompt-line">guest@jt-portfolio:~$ <span class="cursor"></span></div>
      <a href="index.html" class="home-btn">cd ~/home</a>
    </div>
  </div>
</div>

<script>
  // Show the path that was attempted
  const el = document.getElementById('req-path');
  el.textContent = window.location.pathname || '/unknown';

  // Matrix rain
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const chars = 'アイウエオカキクケコABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
  const fontSize = 14;
  let drops = Array(Math.floor(canvas.width / fontSize)).fill(1);

  function draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = fontSize + 'px monospace';

    const cols = Math.floor(canvas.width / fontSize);
    while (drops.length < cols) drops.push(Math.random() * -100);

    for (let i = 0; i < cols; i++) {
      const char = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillStyle = '#00ff41';
      ctx.fillText(char, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }

  setInterval(draw, 40);
</script>
</body>
</html>
